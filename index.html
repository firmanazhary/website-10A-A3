/* output.css – versi siap pakai (setara hasil build Tailwind untuk index.html).
   Kalau sudah install Tailwind, jalankan build dan file ini akan ditimpa otomatis. */
*,::before,::after{box-sizing:border-box;border:0 solid}
html{line-height:1.5;-webkit-text-size-adjust:100%}
body{margin:0;line-height:inherit}
p{margin:0}

/* tema */
.bg-base{background-color:#101010}
.bg-ghost{background-color:#1c1c1c}
.bg-white{background-color:#fff}
.text-white{color:#fff}
.text-accent{color:#ffdd11}
.text-neutral-400{color:#a3a3a3}
.font-sans{font-family:"Inter",system-ui,sans-serif}
.antialiased{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}

/* layout */
.relative{position:relative}
.absolute{position:absolute}
.grid{display:grid}
.place-items-center{place-items:center}
.min-h-svh{min-height:100svh}
.overflow-hidden{overflow:hidden}
.z-10{z-index:10}
.left-5{left:1.25rem}
.top-5{top:1.25rem}
.bottom-6{bottom:1.5rem}
.inset-x-0{left:0;right:0}
.left-1\/2{left:50%}
.top-1\/2{top:50%}
.aspect-\[689\/377\]{aspect-ratio:689/377}
.w-\[max\(135vw\,900px\)\]{width:max(135vw,900px)}
.w-\[min\(62vw\,680px\)\]{width:min(62vw,680px)}

/* teks */
.text-base{font-size:1rem;line-height:1.5rem}
.text-sm{font-size:.875rem;line-height:1.25rem}
.text-center{text-align:center}
.font-light{font-weight:300}
.font-medium{font-weight:500}
.tracking-\[0\.12em\]{letter-spacing:.12em}

/* transform */
.-translate-x-1\/2,.-translate-y-1\/2,.-rotate-\[4deg\]{
  transform:translate(var(--tw-translate-x,0),var(--tw-translate-y,0)) rotate(var(--tw-rotate,0))}
.-translate-x-1\/2{--tw-translate-x:-50%}
.-translate-y-1\/2{--tw-translate-y:-50%}
.-rotate-\[4deg\]{--tw-rotate:-4deg}

/* mask logo */
.\[-webkit-mask\:var\(--logo\)_center\/contain_no-repeat\]{-webkit-mask:var(--logo) center/contain no-repeat}
.\[mask\:var\(--logo\)_center\/contain_no-repeat\]{mask:var(--logo) center/contain no-repeat}

/* animasi */
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.animate-pop{animation:pop 1.1s ease both}

@media (min-width:640px){
  .sm\:left-10{left:2.5rem}
  .sm\:top-8{top:2rem}
}
@media (prefers-reduced-motion:reduce){
  .motion-reduce\:animate-none{animation:none}
}
